<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Make an enquiry with Morgan's Café.">
    <title>Morgan's Café | Enquiry</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">
            <div class="logo">Morgan's Café</div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about-us.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main content -->
    <main>

        <section class="page-heading">
            <h1>Make an Enquiry</h1>
            <p>Have a question? Send us a message.</p>
        </section>

        <section class="form-section">

            <form id="enquiryForm">

                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="enquiryType">Enquiry Type</label>
                <select id="enquiryType" name="enquiryType" required>
                    <option value="">Select an option</option>
                    <option value="menu">Menu Items</option>
                    <option value="availability">Product Availability</option>
                    <option value="branch">Branch Information</option>
                    <option value="general">General Question</option>
                    <option value="other">Other</option>
                </select>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <button type="submit" class="button">Submit Enquiry</button>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Morgan's Café. Made for Good Moments.</p>
    </footer>

</body>
</html>
